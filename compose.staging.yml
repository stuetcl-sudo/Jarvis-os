services:
  jarvis-os:
    build: .
    image: jarvis-os:staging
    command:
      - uvicorn
      - app.main_auth:app
      - --host
      - 0.0.0.0
      - --port
      - "8088"
    restart: "no"

    ports:
      - "127.0.0.1:8098:8088"

    environment:
      APP_NAME: "Jarvis-os Staging"
      DB_PATH: "/data/jarvis-staging.db"
      SAFE_MODE: "true"
      DRY_RUN: "true"
      WORKER_ENABLED: "false"
      ALLOW_RESTART_STOPPED: "false"
      ROUTINE_TIMEZONE: "Europe/Copenhagen"

    volumes:
      - jarvis_staging_data:/data

    networks:
      - jarvis_staging_network

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  jarvis_staging_data:

networks:
  jarvis_staging_network:
