services:
  jarvis-os:
    build: .
    container_name: jarvis-os
    command: ["uvicorn", "app.main_auth:app", "--host", "0.0.0.0", "--port", "8088"]
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - jarvis_data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  jarvis_data:
