name: v0.12 release metadata validation

on:
  pull_request:
    branches:
      - release/v0.12-metadata

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          cp .env.example .env

      - name: Check release metadata
        run: |
          python -m compileall -q app tests
          PYTHONPATH=. python tests/test_admin_ui.py
          python - <<'PY'
          from app import config
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          assert config.VERSION == "0.12.0"
          assert readme.startswith("# Jarvis-os v0.12")
          assert "Current release: `0.12.0`." in readme
          assert "## What is new in v0.12" in readme
          print("Release metadata OK")
          PY

      - name: Run privacy check
        run: bash scripts/privacy_check.sh

      - name: Run complete validation
        run: |
          bash scripts/validate.sh | tee /tmp/v012-release-validation.log
          grep -Fx "Validation OK." /tmp/v012-release-validation.log
