name: v0.11 uncategorized test matrix

on:
  pull_request:
    branches:
      - feature/family-dashboard-v0.11

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tests.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: tests
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import fnmatch
          import glob
          import json

          explicit = {
              "tests/test_admin_ui.py",
              "tests/test_family_dashboard_v011.py",
              "tests/test_wall_dashboard.py",
              "tests/test_frontend_safety.py",
              "tests/test_dashboard_routes.py",
              "tests/test_privacy_check.py",
          }
          patterns = [
              "tests/test_auth*.py",
              "tests/test_login*.py",
              "tests/test_family*.py",
              "tests/test_calendar*.py",
              "tests/test_weather*.py",
              "tests/test_routine*.py",
              "tests/test_live_family*.py",
              "tests/test_action*.py",
              "tests/test_policy*.py",
              "tests/test_dependency*.py",
              "tests/test_docker*.py",
              "tests/test_worker*.py",
              "tests/test_event*.py",
              "tests/test_asset*.py",
              "tests/test_mission*.py",
              "tests/test_service*.py",
              "tests/test_classification*.py",
              "tests/test_brain*.py",
          ]
          tests = []
          for path in sorted(glob.glob("tests/test_*.py")):
              if path in explicit:
                  continue
              if any(fnmatch.fnmatch(path, pattern) for pattern in patterns):
                  continue
              tests.append(path)
          print("matrix=" + json.dumps({"test": tests}, separators=(",", ":")))
          PY

  test:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    name: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -q -r requirements.txt
          cp .env.example .env
      - run: PYTHONPATH=. python "${{ matrix.test }}"
