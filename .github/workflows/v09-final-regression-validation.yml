name: v0.9 final regression validation

on:
  pull_request:
    branches:
      - feature/jarvis-v0.9

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: feature/jarvis-v0.9
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused regression fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path


          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")


          replace_once(
              "tests/test_calendar_integration.py",
              "    assert 'fetch(\"/api/family/calendar\")' in javascript\n",
              """    fetch_match = re.search(
              r'fetch\\(\\s*["\\'](/api/family/calendar)["\\']\\s*,\\s*\\{([^{}]*)\\}\\s*\\)',
              javascript,
          )
          assert fetch_match
          options = fetch_match.group(2)
          assert re.search(r'\\bcredentials\\s*:\\s*["\\']same-origin["\\']', options)
          assert not re.search(r'\\bmethod\\s*:', options, re.IGNORECASE)
          """,
          )

          replace_once(
              "tests/test_weather_integration.py",
              "    assert 'fetch(\"/api/family/weather\")' in javascript\n",
              """    fetch_match = re.search(
              r'fetch\\(\\s*["\\'](/api/family/weather)["\\']\\s*,\\s*\\{([^{}]*)\\}\\s*\\)',
              javascript,
          )
          assert fetch_match
          options = fetch_match.group(2)
          assert re.search(r'\\bcredentials\\s*:\\s*["\\']same-origin["\\']', options)
          assert not re.search(r'\\bmethod\\s*:', options, re.IGNORECASE)
          """,
          )

          replace_once(
              "tests/test_dashboard_routes.py",
              """    fetch_calls = re.findall(r'fetch\\(\\s*["\\']([^"\\']+)["\\']\\s*\\)', javascript)
          assert fetch_calls == [
              "/api/mission", "/api/family/weather", "/api/family/calendar", "/api/health",
          ]
          """,
              """    fetch_calls = re.findall(
              r'fetch\\(\\s*["\\']([^"\\']+)["\\']\\s*(?:,\\s*\\{([^{}]*)\\})?\\s*\\)',
              javascript,
          )
          assert [endpoint for endpoint, _ in fetch_calls] == [
              "/api/mission", "/api/family/weather", "/api/family/calendar", "/api/health",
          ]
          for _, options in fetch_calls:
              assert re.search(r'\\bcredentials\\s*:\\s*["\\']same-origin["\\']', options)
              assert not re.search(r'\\bmethod\\s*:', options, re.IGNORECASE)
          """,
          )

          replace_once(
              "scripts/privacy_check.sh",
              'SECURITY_HEADER_KEYS = {"authorization", "x_csrf_token"}\n',
              'SECURITY_HEADER_KEYS = {"authorization", "x_csrf_token"}\n'
              'FETCH_CREDENTIAL_MODES = {"omit", "same-origin", "include"}\n',
          )
          replace_once(
              "scripts/privacy_check.sh",
              "HEADER_INDEX_ASSIGNMENT_RE",
              "INDEXED_ASSIGNMENT_RE",
          )
          replace_once(
              "scripts/privacy_check.sh",
              "(Authorization|X-CSRF-Token)",
              "([A-Za-z_][A-Za-z0-9_.-]*)",
          )
          replace_once(
              "scripts/privacy_check.sh",
              """def credential_literal(raw_value, value):
          """,
              """def browser_fetch_credential_mode(normalized, raw_value, value, line):
              return (
                  normalized == "credentials"
                  and value.lower() in FETCH_CREDENTIAL_MODES
                  and re.match(r"^\\s*[\"']?credentials[\"']?\\s*:", line, re.I)
                  and re.fullmatch(r"[\"'](?:omit|same-origin|include)[\"']", raw_value, re.I)
              )


          def credential_literal(raw_value, value):
          """,
          )
          replace_once(
              "scripts/privacy_check.sh",
              """            if credential_key(normalized) and credential_literal(raw_value, value):
                  findings.add((number, "credential-assignment"))
          """,
              """            if (
                  credential_key(normalized)
                  and not browser_fetch_credential_mode(normalized, raw_value, value, line)
                  and credential_literal(raw_value, value)
              ):
                  findings.add((number, "credential-assignment"))
          """,
          )

          replace_once(
              "tests/test_privacy_check.py",
              """def test_hardcoded_credentials_remain_detected_across_formats():
          """,
              """def test_browser_fetch_modes_and_dynamic_form_password_are_allowed():
              root = create_test_repository()
              try:
                  scripts = root / "app" / "static" / "js"
                  scripts.mkdir(parents=True)
                  (scripts / "login.js").write_text(
                      'payload["password"] = form.elements.password.value;\\n'
                      'const response = await fetch("/api/auth/login", {\\n'
                      '  credentials: "same-origin",\\n'
                      '});\\n'
                  )
                  (scripts / "wall.js").write_text(
                      'const response = await fetch(endpoint, {\\n'
                      '  method: "POST",\\n'
                      '  credentials: "same-origin",\\n'
                      '});\\n'
                      'await fetch("/api/auth/logout", {\\n'
                      '  method: "POST",\\n'
                      '  credentials: "same-origin",\\n'
                      '});\\n'
                  )
                  result = run(["bash", "scripts/privacy_check.sh"], root, check=False)
                  assert result.returncode == 0, result.stdout
                  assert "credential-assignment" not in result.stdout
              finally:
                  shutil.rmtree(root)


          def test_hardcoded_credentials_remain_detected_across_formats():
          """,
          )
          replace_once(
              "tests/test_privacy_check.py",
              """        javascript_content += 'headers["X-CSRF-Token"] = "' + secret_value + '";\\n'
              json_content = '"' + api_field + '\\": \"' + key_value + '\"\\n'
          """,
              """        javascript_content += 'headers["X-CSRF-Token"] = "' + secret_value + '";\\n'
              javascript_content += 'credentials: "' + secret_value + '",\\n'
              javascript_content += 'payload["' + password_field + '"] = "' + secret_value + '";\\n'
              json_content = '"' + api_field + '\\": \"' + key_value + '\"\\n'
          """,
          )
          replace_once(
              "tests/test_privacy_check.py",
              """            "unsafe.js:3:credential-assignment",
              "unsafe.json:1:credential-assignment",
          """,
              """            "unsafe.js:3:credential-assignment",
              "unsafe.js:4:credential-assignment",
              "unsafe.js:5:credential-assignment",
              "unsafe.json:1:credential-assignment",
          """,
          )
          replace_once(
              "tests/test_privacy_check.py",
              """        test_dynamic_credential_transport_and_references_are_allowed,
              test_hardcoded_credentials_remain_detected_across_formats,
          """,
              """        test_dynamic_credential_transport_and_references_are_allowed,
              test_browser_fetch_modes_and_dynamic_form_password_are_allowed,
              test_hardcoded_credentials_remain_detected_across_formats,
          """,
          )
          PY

          python3 - <<'PY'
          import subprocess

          expected = {
              "scripts/privacy_check.sh",
              "tests/test_calendar_integration.py",
              "tests/test_dashboard_routes.py",
              "tests/test_privacy_check.py",
              "tests/test_weather_integration.py",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != expected:
              raise SystemExit(f"unexpected changed files: {sorted(changed)}")
          PY

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run focused tests and Privacy Check
        shell: bash
        run: |
          PYTHONPATH=. python3 tests/test_calendar_integration.py
          PYTHONPATH=. python3 tests/test_dashboard_routes.py
          PYTHONPATH=. python3 tests/test_weather_integration.py
          PYTHONPATH=. python3 tests/test_privacy_check.py
          bash scripts/privacy_check.sh

      - name: Run every Python test file
        shell: bash
        run: |
          failed=0
          for test in tests/test_*.py; do
            echo "=== $test ==="
            PYTHONPATH=. python3 "$test" || failed=1
          done
          exit "$failed"

      - name: Run complete validation
        shell: bash
        run: |
          bash scripts/validate.sh | tee /tmp/jarvis-validation.log
          grep -Fx "Validation OK." /tmp/jarvis-validation.log

      - name: Commit and push verified fixes
        shell: bash
        run: |
          test "$(git diff --name-only | wc -l)" -eq 5
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add scripts/privacy_check.sh \
            tests/test_calendar_integration.py \
            tests/test_dashboard_routes.py \
            tests/test_privacy_check.py \
            tests/test_weather_integration.py
          git commit -m "Fix final v0.9 test and privacy regressions"
          git push origin HEAD:feature/jarvis-v0.9
