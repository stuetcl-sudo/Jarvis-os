name: v0.13 family lists validation

on:
  pull_request:
    branches:
      - feature/v0.13

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          cp .env.example .env

      - name: Compile and JavaScript syntax
        run: |
          python -m compileall -q app tests
          for script in app/static/js/*.js; do
            node --check "${script}"
          done

      - name: Run focused family regressions
        run: |
          PYTHONPATH=. python tests/test_uv_color_v013.py
          PYTHONPATH=. python tests/test_family_tasks_v012.py
          PYTHONPATH=. python tests/test_auth_roles.py
          PYTHONPATH=. python tests/test_frontend_safety.py
          PYTHONPATH=. python tests/test_wall_dashboard.py

      - name: Run privacy check
        run: bash scripts/privacy_check.sh

      - name: Run complete validation
        run: |
          bash scripts/validate.sh | tee /tmp/v013-family-lists.log
          grep -Fx "Validation OK." /tmp/v013-family-lists.log
