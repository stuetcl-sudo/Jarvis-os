name: v0.12 meal plan validation

on:
  pull_request:
    branches:
      - feature/family-content-v0.12

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          cp .env.example .env

      - name: Compile and JavaScript syntax
        run: |
          python -m compileall -q app tests
          for script in app/static/js/*.js; do
            node --check "${script}"
          done

      - name: Run focused meal plan regression
        run: PYTHONPATH=. python tests/test_meal_plan_v012.py

      - name: Run privacy check
        run: bash scripts/privacy_check.sh

      - name: Run complete validation
        run: |
          bash scripts/validate.sh | tee /tmp/v012-validation.log
          grep -Fx "Validation OK." /tmp/v012-validation.log
