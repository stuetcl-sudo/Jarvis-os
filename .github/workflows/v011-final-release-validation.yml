name: v0.11 final release validation

on:
  pull_request:
    branches:
      - feature/family-dashboard-v0.11

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          cp .env.example .env

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Check JavaScript syntax
        run: |
          for script in app/static/js/*.js; do
            echo "=== ${script} ==="
            node --check "${script}"
          done

      - name: Run Privacy Check
        run: bash scripts/privacy_check.sh

      - name: Run every test file
        run: |
          for test_file in tests/test_*.py; do
            echo "=== ${test_file} ==="
            PYTHONPATH=. python "${test_file}"
          done

      - name: Run complete Docker and live validation
        run: |
          bash scripts/validate.sh | tee /tmp/v011-final-validation.log
          grep -Fx "Validation OK." /tmp/v011-final-validation.log

      - name: Verify release metadata
        run: |
          python - <<'PY'
          from app import config
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          assert config.VERSION == "0.11.0"
          assert readme.startswith("# Jarvis-os v0.11")
          assert "Current release: `0.11.0`." in readme
          print("Release metadata OK")
          PY
