name: v0.11 final release validation

on:
  pull_request:
    branches:
      - feature/family-dashboard-v0.11

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          cp .env.example .env

      - name: Compile and syntax checks
        run: |
          python -m compileall -q app tests
          for script in app/static/js/*.js; do
            node --check "${script}"
          done
          bash scripts/privacy_check.sh

      - name: Test release metadata and administration
        run: PYTHONPATH=. python tests/test_admin_ui.py

      - name: Test family dashboard v0.11
        run: PYTHONPATH=. python tests/test_family_dashboard_v011.py

      - name: Test wall dashboard
        run: PYTHONPATH=. python tests/test_wall_dashboard.py

      - name: Test frontend safety
        run: PYTHONPATH=. python tests/test_frontend_safety.py

      - name: Test dashboard routes
        run: PYTHONPATH=. python tests/test_dashboard_routes.py

      - name: Test privacy scanner regressions
        run: PYTHONPATH=. python tests/test_privacy_check.py

      - name: Test authentication and login group
        run: |
          shopt -s nullglob
          for test_file in tests/test_auth*.py tests/test_login*.py; do
            PYTHONPATH=. python "${test_file}"
          done

      - name: Test family integration group
        run: |
          shopt -s nullglob
          for test_file in tests/test_family*.py tests/test_calendar*.py tests/test_weather*.py tests/test_routine*.py tests/test_live_family*.py; do
            case "${test_file}" in
              tests/test_family_dashboard_v011.py) continue ;;
            esac
            PYTHONPATH=. python "${test_file}"
          done

      - name: Test Action Engine and policy group
        run: |
          shopt -s nullglob
          for test_file in tests/test_action*.py tests/test_policy*.py tests/test_dependency*.py tests/test_docker*.py tests/test_worker*.py; do
            PYTHONPATH=. python "${test_file}"
          done

      - name: Test engine and registry group
        run: |
          shopt -s nullglob
          for test_file in tests/test_event*.py tests/test_asset*.py tests/test_mission*.py tests/test_service*.py tests/test_classification*.py tests/test_brain*.py; do
            PYTHONPATH=. python "${test_file}"
          done

      - name: Run uncategorized test files
        run: |
          failures=0
          for test_file in tests/test_*.py; do
            case "${test_file}" in
              tests/test_admin_ui.py|tests/test_family_dashboard_v011.py|tests/test_wall_dashboard.py|tests/test_frontend_safety.py|tests/test_dashboard_routes.py|tests/test_privacy_check.py|tests/test_auth*.py|tests/test_login*.py|tests/test_family*.py|tests/test_calendar*.py|tests/test_weather*.py|tests/test_routine*.py|tests/test_live_family*.py|tests/test_action*.py|tests/test_policy*.py|tests/test_dependency*.py|tests/test_docker*.py|tests/test_worker*.py|tests/test_event*.py|tests/test_asset*.py|tests/test_mission*.py|tests/test_service*.py|tests/test_classification*.py|tests/test_brain*.py)
                continue
                ;;
            esac
            if PYTHONPATH=. python "${test_file}" >/tmp/test-output.txt 2>&1; then
              echo "PASS ${test_file}"
            else
              echo "FAIL ${test_file}"
              cat /tmp/test-output.txt
              failures=1
            fi
          done
          exit "${failures}"

      - name: Run complete Docker and live validation
        run: |
          bash scripts/validate.sh | tee /tmp/v011-final-validation.log
          grep -Fx "Validation OK." /tmp/v011-final-validation.log

      - name: Verify release metadata
        run: |
          python - <<'PY'
          from app import config
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          assert config.VERSION == "0.11.0"
          assert readme.startswith("# Jarvis-os v0.11")
          assert "Current release: `0.11.0`." in readme
          print("Release metadata OK")
          PY
